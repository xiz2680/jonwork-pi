openapi: 3.1.0
info:
  title: Pi Gateway
  version: 1.0.0
  description: Versioned, stateful gateway for durable Pi Sessions. Stateless chat fallback is forbidden.
servers:
  - url: https://gateway.example.invalid
security:
  - oauth2: [pi.gateway]
paths:
  /.well-known/pi-gateway:
    get:
      operationId: discoverGateway
      security: []
      responses:
        "200":
          description: Version, authentication metadata, capabilities, and limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDiscovery"
  /v1/auth/authorize:
    get:
      operationId: authorizeNativeClient
      security: []
      parameters:
        - in: query
          name: response_type
          required: true
          schema: {const: code}
        - in: query
          name: client_id
          required: true
          schema: {type: string, minLength: 1}
        - in: query
          name: redirect_uri
          required: true
          schema: {type: string, format: uri}
        - in: query
          name: scope
          required: true
          schema: {type: string, minLength: 1}
        - in: query
          name: state
          required: true
          schema: {type: string, minLength: 16, maxLength: 512}
        - in: query
          name: code_challenge
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        - in: query
          name: code_challenge_method
          required: true
          schema: {const: S256}
      responses:
        "302":
          description: Redirect to the exact registered native callback with a single-use code and state, or OAuth error and state.
          headers:
            Location:
              required: true
              schema: {type: string, format: uri}
        default: {$ref: "#/components/responses/OAuthError"}
  /v1/auth/token:
    post:
      operationId: exchangeGatewayToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AuthorizationCodeTokenRequest"
                - $ref: "#/components/schemas/RefreshTokenRequest"
              discriminator:
                propertyName: grant_type
      responses:
        "200":
          description: Short-lived access token and rotated refresh token. Response is private and no-store.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthTokenResponse"}
        "400": {$ref: "#/components/responses/OAuthError"}
        default: {$ref: "#/components/responses/OAuthError"}
  /v1/auth/revoke:
    post:
      operationId: revokeGatewayToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [client_id, token]
              properties:
                client_id: {type: string, minLength: 1}
                token: {type: string, minLength: 32, maxLength: 4096}
                token_type_hint: {enum: [access_token, refresh_token]}
      responses:
        "200":
          description: Idempotent success for known and unknown tokens, returned only after affected work and streams are revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked: {const: true}
        default: {$ref: "#/components/responses/OAuthError"}
  /v1/repositories:
    get:
      operationId: listRepositories
      responses:
        "200":
          description: Authorized repositories.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Repository"}
        default: {$ref: "#/components/responses/Error"}
  /v1/models:
    get:
      operationId: listModels
      responses:
        "200":
          description: Models available to the authenticated principal.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Model"}
        default: {$ref: "#/components/responses/Error"}
  /v1/sessions:
    get:
      operationId: listSessions
      parameters:
        - in: query
          name: repositoryId
          schema: {type: string}
      responses:
        "200":
          description: Durable Sessions visible to the principal.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SessionSummary"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId, repositoryId]
              properties:
                clientId: {$ref: "#/components/schemas/ClientId"}
                repositoryId: {type: string, minLength: 1}
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        "201":
          description: Session created with the requesting client as controller.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionSnapshot"}
        default: {$ref: "#/components/responses/Error"}
  /v1/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionSnapshot
      responses:
        "200":
          description: Authoritative replacement snapshot.
          headers:
            ETag:
              required: true
              schema: {type: string, pattern: '^"[0-9]+"$'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionSnapshot"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: renameSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId, name]
              properties:
                clientId: {$ref: "#/components/schemas/ClientId"}
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200": {$ref: "#/components/responses/MutationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/sessions/{sessionId}/restore:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: restoreSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId]
              properties:
                clientId: {$ref: "#/components/schemas/ClientId"}
      responses:
        "200":
          description: Running authoritative snapshot. Existing runtime attachment is idempotent.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionSnapshot"}
        default: {$ref: "#/components/responses/Error"}
  /v1/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamSessionEvents
      parameters:
        - in: header
          name: Last-Event-ID
          schema: {$ref: "#/components/schemas/EventId"}
        - in: query
          name: after
          description: Alternative cursor when the client cannot set Last-Event-ID.
          schema: {$ref: "#/components/schemas/EventId"}
        - in: query
          name: clientId
          required: true
          schema: {$ref: "#/components/schemas/ClientId"}
      responses:
        "200":
          description: SSE records with `id`, `event`, and JSON `data`; heartbeat comments do not advance the cursor.
          x-event-schema:
            $ref: "#/components/schemas/GatewayEvent"
          content:
            text/event-stream:
              schema: {type: string}
        "409":
          description: Replay cursor expired; fetch a new snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        default: {$ref: "#/components/responses/Error"}
  /v1/sessions/{sessionId}/commands:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: submitCommand
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Command"}
      responses:
        "202": {$ref: "#/components/responses/MutationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/sessions/{sessionId}/mutation-receipt:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: lookupMutationReceipt
      description: Read-only lookup after an ambiguous mutation response. It never submits or retries work.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ClientIdHeader"
      responses:
        "200":
          description: The original mutation is pending or its original applied receipt is available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MutationReceiptLookup"}
        "404":
          description: No retained mutation exists for this principal, Session, client, and key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        default: {$ref: "#/components/responses/Error"}
  /v1/sessions/{sessionId}/takeover:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: takeoverSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId]
              properties:
                clientId: {$ref: "#/components/schemas/ClientId"}
      responses:
        "200": {$ref: "#/components/responses/MutationAccepted"}
        "409":
          description: Active run or stale revision prevents takeover.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        default: {$ref: "#/components/responses/Error"}
  /v1/sessions/{sessionId}/release:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: releaseSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId]
              properties:
                clientId: {$ref: "#/components/schemas/ClientId"}
      responses:
        "200": {$ref: "#/components/responses/MutationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/attachments:
    post:
      operationId: uploadAttachment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: X-File-Name
          required: true
          description: Percent-encoded UTF-8 NFC display name; decoded value is at most 255 bytes and cannot contain path separators, NUL, `.` or `..`.
          schema: {type: string, minLength: 1, maxLength: 255}
        - in: header
          name: Content-Length
          required: true
          schema: {type: integer, minimum: 1, maximum: 10485760}
        - $ref: "#/components/parameters/ContentDigest"
        - in: query
          name: repositoryId
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
          image/webp:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: Validated, principal-scoped attachment reference.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Attachment"}
        default: {$ref: "#/components/responses/Error"}
  /v1/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      operationId: getAttachmentMetadata
      responses:
        "200":
          description: Authorized attachment metadata. Response is private and no-store.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Attachment"}
        default: {$ref: "#/components/responses/Error"}
  /v1/attachments/{attachmentId}/content:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      operationId: downloadAttachmentContent
      description: Full original bytes only. Range requests and redirects are not supported in v1.
      responses:
        "200":
          description: Authorized raw attachment bytes. Response is private and no-store.
          headers:
            Content-Type:
              required: true
              schema: {type: string}
            Content-Length:
              required: true
              schema: {type: integer, minimum: 1, maximum: 10485760}
            Content-Digest:
              required: true
              schema: {type: string, pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$'}
            ETag:
              required: true
              schema: {type: string, pattern: '^"sha256-[a-f0-9]{64}"$'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Native authorization-code flow requires PKCE S256. Query-string tokens are forbidden.
      flows:
        authorizationCode:
          authorizationUrl: https://gateway.example.invalid/v1/auth/authorize
          tokenUrl: https://gateway.example.invalid/v1/auth/token
          refreshUrl: https://gateway.example.invalid/v1/auth/token
          scopes:
            pi.gateway: Access repositories, durable Sessions, events, commands, and attachments.
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
    AttachmentId:
      in: path
      name: attachmentId
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: Quoted authoritative Session revision, for example `"42"`.
      schema: {type: string, pattern: '^"[0-9]+"$'}
    ClientIdHeader:
      in: header
      name: X-Client-Id
      required: true
      schema: {$ref: "#/components/schemas/ClientId"}
    ContentDigest:
      in: header
      name: Content-Digest
      required: true
      description: RFC 9530 SHA-256 digest of the exact transmitted bytes.
      schema: {type: string, pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$'}
  headers:
    IdempotencyReplayed:
      schema: {type: boolean}
  responses:
    MutationAccepted:
      description: Mutation admitted or an identical result replayed.
      headers:
        Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
        ETag:
          schema: {type: string, pattern: '^"[0-9]+"$'}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MutationReceipt"}
    Error:
      description: Structured failure.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    OAuthError:
      description: OAuth error. Tokens, authorization codes, and verifier values are never echoed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OAuthErrorResponse"}
  schemas:
    ClientId:
      type: string
      minLength: 1
      maxLength: 128
    EventId:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
    EntityId:
      type: string
      minLength: 1
      maxLength: 128
    AuthorizationCodeTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type, client_id, code, code_verifier, redirect_uri]
      properties:
        grant_type: {const: authorization_code}
        client_id: {type: string, minLength: 1}
        code: {type: string, minLength: 32, maxLength: 512}
        code_verifier: {type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$'}
        redirect_uri: {type: string, format: uri}
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type, client_id, refresh_token]
      properties:
        grant_type: {const: refresh_token}
        client_id: {type: string, minLength: 1}
        refresh_token: {type: string, minLength: 32, maxLength: 4096}
    OAuthTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in, scope]
      properties:
        access_token: {type: string, minLength: 32, maxLength: 4096}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 60, maximum: 3600}
        refresh_token: {type: string, minLength: 32, maxLength: 4096}
        refresh_expires_in: {type: integer, minimum: 300}
        scope: {const: pi.gateway}
    OAuthErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {enum: [invalid_request, invalid_client, invalid_grant, unsupported_grant_type, invalid_scope, access_denied, temporarily_unavailable]}
        error_description: {type: string, maxLength: 500}
    GatewayEventError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {type: string, minLength: 1, maxLength: 128}
        message: {type: string}
        retryable: {type: boolean}
    GatewayEventEnvelope:
      type: object
      required: [contract, id, sessionId, sessionRevision, occurredAt, type, data]
      properties:
        contract: {const: pi-gateway/1.0}
        id: {$ref: "#/components/schemas/EventId"}
        sessionId: {$ref: "#/components/schemas/EntityId"}
        sessionRevision: {type: integer, minimum: 0}
        occurredAt: {type: string, format: date-time}
        type: {type: string}
        data: {type: object}
    GatewayEvent:
      description: Versioned event envelope. The outer `type` selects the exact `data` schema.
      oneOf:
        - {$ref: "#/components/schemas/OperationAcceptedEvent"}
        - {$ref: "#/components/schemas/UserMessageEvent"}
        - {$ref: "#/components/schemas/TurnStartedEvent"}
        - {$ref: "#/components/schemas/AssistantMessageStartedEvent"}
        - {$ref: "#/components/schemas/AssistantTextDeltaEvent"}
        - {$ref: "#/components/schemas/AssistantReasoningDeltaEvent"}
        - {$ref: "#/components/schemas/ToolStartedEvent"}
        - {$ref: "#/components/schemas/ToolUpdatedEvent"}
        - {$ref: "#/components/schemas/ToolCompletedEvent"}
        - {$ref: "#/components/schemas/AssistantMessageCompletedEvent"}
        - {$ref: "#/components/schemas/TurnCompletedEvent"}
        - {$ref: "#/components/schemas/AbortRequestedEvent"}
        - {$ref: "#/components/schemas/OperationSettledEvent"}
        - {$ref: "#/components/schemas/GatewayErrorEvent"}
        - {$ref: "#/components/schemas/ControllerChangedEvent"}
        - {$ref: "#/components/schemas/SessionReleasedEvent"}
      discriminator:
        propertyName: type
        mapping:
          operation.accepted: "#/components/schemas/OperationAcceptedEvent"
          user.message: "#/components/schemas/UserMessageEvent"
          turn.started: "#/components/schemas/TurnStartedEvent"
          assistant.message.started: "#/components/schemas/AssistantMessageStartedEvent"
          assistant.text.delta: "#/components/schemas/AssistantTextDeltaEvent"
          assistant.reasoning.delta: "#/components/schemas/AssistantReasoningDeltaEvent"
          tool.started: "#/components/schemas/ToolStartedEvent"
          tool.updated: "#/components/schemas/ToolUpdatedEvent"
          tool.completed: "#/components/schemas/ToolCompletedEvent"
          assistant.message.completed: "#/components/schemas/AssistantMessageCompletedEvent"
          turn.completed: "#/components/schemas/TurnCompletedEvent"
          abort.requested: "#/components/schemas/AbortRequestedEvent"
          operation.settled: "#/components/schemas/OperationSettledEvent"
          gateway.error: "#/components/schemas/GatewayErrorEvent"
          controller.changed: "#/components/schemas/ControllerChangedEvent"
          session.released: "#/components/schemas/SessionReleasedEvent"
    OperationAcceptedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: operation.accepted}
            data: {$ref: "#/components/schemas/OperationAcceptedData"}
    UserMessageEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: user.message}
            data: {$ref: "#/components/schemas/UserMessageData"}
    TurnStartedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: turn.started}
            data: {$ref: "#/components/schemas/TurnData"}
    AssistantMessageStartedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: assistant.message.started}
            data: {$ref: "#/components/schemas/AssistantMessageIdentity"}
    AssistantTextDeltaEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: assistant.text.delta}
            data: {$ref: "#/components/schemas/AssistantDeltaData"}
    AssistantReasoningDeltaEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: assistant.reasoning.delta}
            data: {$ref: "#/components/schemas/AssistantDeltaData"}
    ToolStartedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: tool.started}
            data: {$ref: "#/components/schemas/ToolStartedData"}
    ToolUpdatedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: tool.updated}
            data: {$ref: "#/components/schemas/ToolUpdatedData"}
    ToolCompletedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: tool.completed}
            data: {$ref: "#/components/schemas/ToolCompletedData"}
    AssistantMessageCompletedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: assistant.message.completed}
            data: {$ref: "#/components/schemas/AssistantMessageCompletedData"}
    TurnCompletedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: turn.completed}
            data: {$ref: "#/components/schemas/TurnCompletedData"}
    AbortRequestedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: abort.requested}
            data: {$ref: "#/components/schemas/AbortRequestedData"}
    OperationSettledEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: operation.settled}
            data: {$ref: "#/components/schemas/OperationSettledData"}
    GatewayErrorEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: gateway.error}
            data: {$ref: "#/components/schemas/GatewayErrorData"}
    ControllerChangedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: controller.changed}
            data: {$ref: "#/components/schemas/ControllerChangedData"}
    SessionReleasedEvent:
      unevaluatedProperties: false
      allOf:
        - {$ref: "#/components/schemas/GatewayEventEnvelope"}
        - type: object
          required: [type, data]
          properties:
            type: {const: session.released}
            data: {$ref: "#/components/schemas/SessionReleasedData"}
    OperationAcceptedData:
      type: object
      additionalProperties: false
      required: [operationId, command, retryOfOperationId]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        command: {enum: [prompt, steer, follow_up, abort, retry, compact, set_model, set_thinking_level]}
        retryOfOperationId: {oneOf: [{$ref: "#/components/schemas/EntityId"}, {type: "null"}]}
    UserMessageData:
      type: object
      additionalProperties: false
      required: [operationId, messageId, text, attachmentIds]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        messageId: {$ref: "#/components/schemas/EntityId"}
        text: {type: string}
        attachmentIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items: {$ref: "#/components/schemas/EntityId"}
    TurnData:
      type: object
      additionalProperties: false
      required: [operationId, turnId]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
    AssistantMessageIdentity:
      type: object
      additionalProperties: false
      required: [operationId, turnId, messageId]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
        messageId: {$ref: "#/components/schemas/EntityId"}
    AssistantDeltaData:
      type: object
      additionalProperties: false
      required: [operationId, turnId, messageId, delta]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
        messageId: {$ref: "#/components/schemas/EntityId"}
        delta: {type: string}
    ToolIdentity:
      type: object
      additionalProperties: false
      required: [operationId, turnId, messageId, toolCallId, parentCallId]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
        messageId: {$ref: "#/components/schemas/EntityId"}
        toolCallId: {$ref: "#/components/schemas/EntityId"}
        parentCallId: {oneOf: [{$ref: "#/components/schemas/EntityId"}, {type: "null"}]}
    ToolStartedData:
      type: object
      additionalProperties: false
      required: [operationId, turnId, messageId, toolCallId, parentCallId, toolName, arguments]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
        messageId: {$ref: "#/components/schemas/EntityId"}
        toolCallId: {$ref: "#/components/schemas/EntityId"}
        parentCallId: {oneOf: [{$ref: "#/components/schemas/EntityId"}, {type: "null"}]}
        toolName: {type: string, minLength: 1}
        arguments: {}
    ToolUpdatedData:
      type: object
      additionalProperties: false
      required: [operationId, turnId, messageId, toolCallId, parentCallId, updateSequence, partialResult]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
        messageId: {$ref: "#/components/schemas/EntityId"}
        toolCallId: {$ref: "#/components/schemas/EntityId"}
        parentCallId: {oneOf: [{$ref: "#/components/schemas/EntityId"}, {type: "null"}]}
        updateSequence: {type: integer, minimum: 1}
        partialResult: {}
    ToolCompletedData:
      type: object
      additionalProperties: false
      required: [operationId, turnId, messageId, toolCallId, parentCallId, status, result, error]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
        messageId: {$ref: "#/components/schemas/EntityId"}
        toolCallId: {$ref: "#/components/schemas/EntityId"}
        parentCallId: {oneOf: [{$ref: "#/components/schemas/EntityId"}, {type: "null"}]}
        status: {enum: [success, failure]}
        result: {}
        error: {oneOf: [{$ref: "#/components/schemas/GatewayEventError"}, {type: "null"}]}
    AssistantMessageCompletedData:
      type: object
      additionalProperties: false
      required: [operationId, turnId, messageId, status, error]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
        messageId: {$ref: "#/components/schemas/EntityId"}
        status: {enum: [completed, aborted, error]}
        error: {oneOf: [{$ref: "#/components/schemas/GatewayEventError"}, {type: "null"}]}
    TurnCompletedData:
      type: object
      additionalProperties: false
      required: [operationId, turnId, status]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        turnId: {$ref: "#/components/schemas/EntityId"}
        status: {enum: [completed, aborted, failed]}
    AbortRequestedData:
      type: object
      additionalProperties: false
      required: [operationId, requestedByClientId]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        requestedByClientId: {$ref: "#/components/schemas/ClientId"}
    OperationSettledData:
      type: object
      additionalProperties: false
      required: [operationId, status, retryOfOperationId, error]
      properties:
        operationId: {$ref: "#/components/schemas/EntityId"}
        status: {enum: [completed, aborted, failed]}
        retryOfOperationId: {oneOf: [{$ref: "#/components/schemas/EntityId"}, {type: "null"}]}
        error: {oneOf: [{$ref: "#/components/schemas/GatewayEventError"}, {type: "null"}]}
    GatewayErrorData:
      type: object
      additionalProperties: false
      required: [operationId, error]
      properties:
        operationId: {oneOf: [{$ref: "#/components/schemas/EntityId"}, {type: "null"}]}
        error: {$ref: "#/components/schemas/GatewayEventError"}
    ControllerChangedData:
      type: object
      additionalProperties: false
      required: [previousControllerClientId, controllerClientId, reason]
      properties:
        previousControllerClientId: {oneOf: [{$ref: "#/components/schemas/ClientId"}, {type: "null"}]}
        controllerClientId: {oneOf: [{$ref: "#/components/schemas/ClientId"}, {type: "null"}]}
        reason: {enum: [takeover, release, disconnect, expired]}
    SessionReleasedData:
      type: object
      additionalProperties: false
      required: [byClientId]
      properties:
        byClientId: {$ref: "#/components/schemas/ClientId"}
    GatewayDiscovery:
      type: object
      additionalProperties: false
      required: [contract, apiVersion, authentication, capabilities, limits]
      properties:
        contract: {const: pi-gateway/1.0}
        apiVersion: {type: string, pattern: '^1\\.[0-9]+$'}
        authentication:
          type: object
          additionalProperties: false
          required: [type, clientId, authorizationEndpoint, tokenEndpoint, revocationEndpoint, scopes, pkceMethods, accessTokenLifetimeSeconds, refreshTokenRotation]
          properties:
            type: {const: oauth2_authorization_code}
            clientId: {type: string, minLength: 1}
            authorizationEndpoint: {type: string, format: uri}
            tokenEndpoint: {type: string, format: uri}
            revocationEndpoint: {type: string, format: uri}
            scopes:
              type: array
              prefixItems: [{const: pi.gateway}]
              minItems: 1
              maxItems: 1
            pkceMethods:
              type: array
              prefixItems: [{const: S256}]
              minItems: 1
              maxItems: 1
            accessTokenLifetimeSeconds: {type: integer, minimum: 60, maximum: 3600}
            refreshTokenRotation: {const: required}
        capabilities:
          type: object
          additionalProperties: false
          required: [repositories, models, thinking, sessions, commands, sse, authoritativeSnapshot, eventIds, replay, idempotency, singleWriter, takeover, release, abort, retry, attachments]
          properties:
            repositories: {type: boolean}
            models: {type: boolean}
            thinking: {type: boolean}
            sessions: {type: boolean}
            commands: {type: boolean}
            sse: {type: boolean}
            authoritativeSnapshot: {type: boolean}
            eventIds: {type: boolean}
            replay: {type: boolean}
            idempotency: {type: boolean}
            singleWriter: {type: boolean}
            takeover: {type: boolean}
            release: {type: boolean}
            abort: {type: boolean}
            retry: {type: boolean}
            attachments:
              type: object
              additionalProperties: false
              required: [images, files]
              properties:
                images: {type: boolean}
                files: {type: boolean}
        limits: {$ref: "#/components/schemas/GatewayLimits"}
    GatewayLimits:
      type: object
      additionalProperties: false
      required: [readTimeoutMs, mutationTimeoutMs, sseConnectTimeoutMs, replayRetentionEvents, replayRetentionSeconds, idempotencyRetentionSeconds, attachmentMaxBytes, attachmentTotalBytes, attachmentsPerPrompt, attachmentUploadTimeoutMs, attachmentDownloadTimeoutMs, attachmentMediaTypes, attachmentDigestAlgorithm]
      properties:
        readTimeoutMs: {type: integer, minimum: 1}
        mutationTimeoutMs: {type: integer, minimum: 1}
        sseConnectTimeoutMs: {type: integer, minimum: 1}
        replayRetentionEvents: {type: integer, minimum: 1}
        replayRetentionSeconds: {type: integer, minimum: 1}
        idempotencyRetentionSeconds: {type: integer, minimum: 86400}
        attachmentMaxBytes: {type: integer, minimum: 1, maximum: 10485760}
        attachmentTotalBytes: {type: integer, minimum: 1, maximum: 20971520}
        attachmentsPerPrompt: {type: integer, minimum: 0, maximum: 4}
        attachmentUploadTimeoutMs: {type: integer, minimum: 1, maximum: 30000}
        attachmentDownloadTimeoutMs: {type: integer, minimum: 1, maximum: 30000}
        attachmentMediaTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        attachmentDigestAlgorithm: {const: sha-256}
    Repository:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: {type: string, minLength: 1}
        displayName: {type: string, minLength: 1}
    Model:
      type: object
      additionalProperties: false
      required: [provider, id, name, reasoning, input, thinkingLevels]
      properties:
        provider: {type: string, minLength: 1}
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        reasoning: {type: boolean}
        input:
          type: array
          items: {enum: [text, image, file]}
          uniqueItems: true
        thinkingLevels:
          type: array
          items: {enum: [off, minimal, low, medium, high, xhigh, max]}
          uniqueItems: true
        contextWindow: {type: integer, minimum: 1}
        maxOutputTokens: {type: integer, minimum: 1}
    SessionSummary:
      type: object
      additionalProperties: false
      required: [sessionId, repositoryId, name, createdAt, modifiedAt, messageCount, runtime]
      properties:
        sessionId: {type: string}
        repositoryId: {type: string}
        name: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        modifiedAt: {type: string, format: date-time}
        messageCount: {type: integer, minimum: 0}
        runtime: {enum: [stopped, starting, running, stopping]}
    SessionSnapshot:
      type: object
      additionalProperties: false
      required: [contract, sessionId, repositoryId, revision, lastEventId, runtime, run, controller, configuration, messages, attachments]
      properties:
        contract: {const: pi-gateway/1.0}
        sessionId: {type: string}
        repositoryId: {type: string}
        revision: {type: integer, minimum: 0}
        lastEventId: {$ref: "#/components/schemas/EventId"}
        runtime: {enum: [stopped, starting, running, stopping]}
        run:
          type: object
          required: [status, operationId]
          properties:
            status: {enum: [idle, queued, running, settling]}
            operationId: {type: [string, "null"]}
        controller:
          type: object
          required: [clientId, leaseExpiresAt]
          properties:
            clientId: {type: [string, "null"]}
            leaseExpiresAt: {type: [string, "null"], format: date-time}
        configuration:
          type: object
          required: [model, thinkingLevel]
          properties:
            model:
              oneOf:
                - type: "null"
                - type: object
                  required: [provider, id]
                  properties:
                    provider: {type: string}
                    id: {type: string}
            thinkingLevel: {enum: [off, minimal, low, medium, high, xhigh, max]}
        messages:
          type: array
          items: {$ref: "#/components/schemas/Message"}
        attachments:
          type: array
          items: {$ref: "#/components/schemas/Attachment"}
    Message:
      type: object
      additionalProperties: false
      required: [id, role, status, content]
      properties:
        id: {type: string}
        role: {enum: [user, assistant, tool]}
        status: {enum: [streaming, completed, aborted, error]}
        content:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: {enum: [text, thinking, tool_call, tool_result, attachment]}
              text: {type: string}
              toolCallId: {type: string}
              attachmentId: {type: string}
    Attachment:
      type: object
      additionalProperties: false
      required: [attachmentId, repositoryId, kind, fileName, mediaType, byteLength, sha256, status, createdAt, expiresAt, contentPath]
      properties:
        attachmentId: {type: string}
        repositoryId: {type: string}
        kind: {enum: [image, file]}
        fileName: {type: string}
        mediaType: {type: string}
        byteLength: {type: integer, minimum: 1, maximum: 10485760}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {enum: [ready, consumed, rejected, expired]}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        contentPath: {type: string, pattern: '^/v1/attachments/[A-Za-z0-9._-]+/content$'}
    PromptBody:
      type: object
      additionalProperties: false
      required: [clientId, type, text, attachmentIds]
      properties:
        clientId: {$ref: "#/components/schemas/ClientId"}
        type: {enum: [prompt, steer, follow_up]}
        text: {type: string, minLength: 1, maxLength: 100000}
        attachmentIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items: {type: string}
    Command:
      oneOf:
        - $ref: "#/components/schemas/PromptBody"
        - type: object
          additionalProperties: false
          required: [clientId, type]
          properties:
            clientId: {$ref: "#/components/schemas/ClientId"}
            type: {const: abort}
        - type: object
          additionalProperties: false
          required: [clientId, type, operationId]
          properties:
            clientId: {$ref: "#/components/schemas/ClientId"}
            type: {const: retry}
            operationId: {type: string, minLength: 1}
        - type: object
          additionalProperties: false
          required: [clientId, type, provider, modelId]
          properties:
            clientId: {$ref: "#/components/schemas/ClientId"}
            type: {const: set_model}
            provider: {type: string, minLength: 1}
            modelId: {type: string, minLength: 1}
        - type: object
          additionalProperties: false
          required: [clientId, type, level]
          properties:
            clientId: {$ref: "#/components/schemas/ClientId"}
            type: {const: set_thinking_level}
            level: {enum: [off, minimal, low, medium, high, xhigh, max]}
        - type: object
          additionalProperties: false
          required: [clientId, type]
          properties:
            clientId: {$ref: "#/components/schemas/ClientId"}
            type: {const: compact}
            instructions: {type: [string, "null"], maxLength: 10000}
      discriminator:
        propertyName: type
    MutationReceipt:
      type: object
      additionalProperties: false
      required: [status, sessionId, revision, operationId, afterEventId, responseStatus]
      properties:
        status: {const: applied}
        sessionId: {type: string}
        revision: {type: integer, minimum: 1}
        operationId: {type: [string, "null"]}
        afterEventId: {$ref: "#/components/schemas/EventId"}
        responseStatus: {type: integer, minimum: 200, maximum: 299}
    PendingMutationReceipt:
      type: object
      additionalProperties: false
      required: [status, sessionId]
      properties:
        status: {const: pending}
        sessionId: {type: string}
    MutationReceiptLookup:
      oneOf:
        - $ref: "#/components/schemas/PendingMutationReceipt"
        - $ref: "#/components/schemas/MutationReceipt"
      discriminator:
        propertyName: status
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, retryable]
          properties:
            code:
              enum: [invalid_request, unauthenticated, forbidden, capability_unavailable, session_not_found, session_not_running, not_controller, session_busy, revision_conflict, idempotency_conflict, mutation_not_found, invalid_replay_cursor, replay_cursor_expired, duplicate_event, out_of_order_event, event_gap, invalid_event_lifecycle, attachment_not_found, attachment_too_large, attachment_type_unsupported, attachment_limit_exceeded, timeout, rate_limited, internal_error]
            message: {type: string}
            requestId: {type: string}
            retryable: {type: boolean}
            details: {type: object, additionalProperties: true}
