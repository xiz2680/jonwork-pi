<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f8f9fb" />
		<title>Jonwork · AI 工业设计协作平台</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<div class="app-shell">
			<aside class="sidebar" id="sidebar">
				<div class="brand-row"><div class="brand">Jonwork</div><button class="icon-button" id="collapseButton" aria-label="收起侧栏"><iconify-icon icon="solar:sidebar-minimalistic-linear"></iconify-icon></button></div>
				<nav class="primary-nav" aria-label="主导航">
					<a class="nav-item active" href="#"><iconify-icon icon="solar:home-2-linear"></iconify-icon><span>主页</span></a>
					<a class="nav-item unavailable" href="#" aria-disabled="true"><iconify-icon icon="solar:cursor-square-linear"></iconify-icon><span>无限画布</span><small>规划中</small></a>
					<a class="nav-item" href="#"><iconify-icon icon="solar:scanner-2-linear"></iconify-icon><span>产品调研</span><iconify-icon class="chevron" icon="solar:alt-arrow-right-linear"></iconify-icon></a>
					<a class="nav-item" href="#"><iconify-icon icon="solar:widget-3-linear"></iconify-icon><span>造型工作台</span><iconify-icon class="chevron" icon="solar:alt-arrow-right-linear"></iconify-icon></a>
					<a class="nav-item" href="#"><iconify-icon icon="solar:palette-linear"></iconify-icon><span>设计实验室</span><iconify-icon class="chevron" icon="solar:alt-arrow-right-linear"></iconify-icon></a>
					<a class="nav-item" href="#"><iconify-icon icon="solar:clipboard-check-linear"></iconify-icon><span>设计诊断</span><iconify-icon class="chevron" icon="solar:alt-arrow-right-linear"></iconify-icon></a>
					<a class="nav-item" href="#"><iconify-icon icon="solar:folder-linear"></iconify-icon><span>项目资产</span></a>
					<a class="nav-item" href="#"><iconify-icon icon="solar:gallery-wide-linear"></iconify-icon><span>素材库</span></a>
					<a class="nav-item" href="#"><iconify-icon icon="solar:list-check-linear"></iconify-icon><span>任务队列</span></a>
				</nav>
				<section class="quick-nav" aria-label="快捷创作">
					<div class="section-label"><span>快捷创作</span><small>常用</small></div>
					<div class="quick-grid">
						<button type="button" data-quick-action="new"><span><iconify-icon icon="solar:add-circle-linear"></iconify-icon></span><b>新建设计</b></button>
						<button type="button" data-quick-action="image"><span><iconify-icon icon="solar:gallery-add-linear"></iconify-icon></span><b>生成概念图</b></button>
						<button type="button" data-quick-action="attach"><span><iconify-icon icon="solar:gallery-wide-linear"></iconify-icon></span><b>添加参考图</b></button>
						<button type="button" data-quick-action="results"><span><iconify-icon icon="solar:gallery-wide-linear"></iconify-icon></span><b>查看产出</b></button>
					</div>
				</section>
				<section class="history"><div class="section-label"><span>最近对话</span><button class="icon-button" id="newConversationButton" aria-label="新建对话"><iconify-icon icon="solar:add-circle-linear"></iconify-icon></button></div><div id="historyList"><p class="history-empty">暂无历史会话</p></div></section>
				<div class="sidebar-footer"><a class="nav-item unavailable" href="#" aria-disabled="true"><iconify-icon icon="solar:brain-linear"></iconify-icon><span>记忆</span><small>规划中</small></a><a class="nav-item unavailable" href="#" aria-disabled="true"><iconify-icon icon="solar:notebook-linear"></iconify-icon><span>知识中心</span><small>规划中</small></a><div class="profile"><span class="avatar small">本</span><span>本地用户</span><small>未登录</small></div></div>
			</aside>

			<main class="conversation">
				<header class="conversation-header"><button class="mobile-menu icon-button" id="mobileMenu" aria-label="打开菜单"><iconify-icon icon="solar:hamburger-menu-linear"></iconify-icon></button><div><h1>新对话</h1><p>工业设计智能协作会话</p></div><div class="header-actions"><span class="save-state"><iconify-icon icon="solar:check-circle-linear"></iconify-icon>本地会话</span><button class="soft-button run-panel-trigger" id="openRunPanel" aria-label="打开任务面板"><iconify-icon icon="solar:graph-new-up-linear"></iconify-icon><span>任务进度</span></button><button class="soft-button" id="shareButton"><iconify-icon icon="solar:share-linear"></iconify-icon>分享</button></div></header>
				<section class="message-scroll" id="messageScroll"><div class="empty-conversation" id="emptyConversation"><span class="ai-avatar avatar">J</span><h2>今天想设计什么？</h2><p>输入任务后，Jonwork 会完成分析、工具调用和方案输出。</p></div></section>
				<form class="composer" id="composer"><div id="attachmentList" class="attachment-list" aria-live="polite"></div><textarea id="promptInput" aria-label="描述设计任务" placeholder="描述产品、使用场景或希望解决的问题…" rows="1"></textarea><div class="composer-toolbar"><div><button type="button" class="composer-button" id="attachButton" aria-label="添加参考图片" title="添加参考图片"><iconify-icon icon="solar:add-circle-linear"></iconify-icon></button><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden /><button type="button" class="select-button" id="modeButton"><iconify-icon icon="solar:magic-stick-3-linear"></iconify-icon>设计模式</button><button type="button" class="select-button" id="modelButton"><iconify-icon icon="solar:cpu-bolt-linear"></iconify-icon><span id="modelLabel">默认模型</span></button><label class="thinking-toggle"><input id="thinkingToggle" type="checkbox" checked /><span></span>深度思考</label></div><div><span class="composer-hint">Enter 发送 · Shift+Enter 换行</span><button type="button" class="composer-button" id="voiceButton" aria-label="语音输入" title="语音输入"><iconify-icon icon="solar:microphone-3-linear"></iconify-icon></button><button type="submit" class="send-button" id="sendButton" aria-label="发送"><iconify-icon icon="solar:arrow-up-linear"></iconify-icon></button></div></div></form>
			</main>

			<aside class="run-panel" id="runPanel">
				<header class="run-header"><div><span class="pi-mark"><iconify-icon icon="solar:graph-new-up-linear"></iconify-icon></span><h2>设计任务</h2></div><div class="connection"><span id="connectionDot"></span><span id="connectionLabel">服务准备中</span></div><button class="panel-close icon-button" id="closePanel" aria-label="关闭任务面板"><iconify-icon icon="solar:close-circle-linear"></iconify-icon></button></header>
				<div class="run-content"><section class="run-summary"><div class="summary-head"><span class="task-icon"><iconify-icon icon="solar:box-minimalistic-linear"></iconify-icon></span><div><strong id="runTitle">等待任务</strong><small>智能设计工作台</small></div></div><div class="summary-meta"><span><i class="status-dot"></i><b id="runStatus">空闲</b></span><strong id="elapsed">00:00</strong></div><div class="progress"><span id="progressBar" style="width:0"></span></div><div class="progress-label"><span>当前进度</span><b id="progressCount">0 / 0</b></div></section>
					<div class="run-tabs" role="tablist"><button class="active" role="tab" aria-selected="true" data-tab="process"><iconify-icon icon="solar:list-check-linear"></iconify-icon><span class="tab-label">执行过程</span></button><button role="tab" aria-selected="false" data-tab="results"><iconify-icon icon="solar:gallery-wide-linear"></iconify-icon><span class="tab-label">产出结果</span><span class="tab-count" id="resultCount">0</span></button><button role="tab" aria-selected="false" data-tab="resources"><iconify-icon icon="solar:folder-with-files-linear"></iconify-icon><span class="tab-label">相关资源</span><span class="tab-count" id="resourceCount">0</span></button></div><section class="tab-panel" id="tabPanel" hidden></section>
					<ol class="steps" id="steps"></ol>
					<section class="permission-card resolved" id="permissionCard"><div><span class="permission-icon"><iconify-icon icon="solar:folder-with-files-linear"></iconify-icon></span><div><strong>需要你的确认</strong><p>权限请求会显示在这里。</p></div></div><div><button data-permission="false">拒绝</button><button class="primary" data-permission="true">允许访问</button></div></section>
				</div>
				<footer class="run-actions"><button class="danger" id="stopButton"><span class="action-icon"><iconify-icon icon="solar:stop-bold"></iconify-icon></span><span>停止任务</span></button><button class="retry-action" id="retryButton"><span class="action-icon"><iconify-icon icon="solar:restart-linear"></iconify-icon></span><span>重试当前步骤</span></button></footer>
			</aside>
		</div>
		<div class="toast" id="toast" role="status"></div>
		<dialog id="imageDialog" class="image-dialog"><button id="closeImage" class="icon-button" aria-label="关闭">×</button><img id="dialogImage" alt="会话生成的设计图大图" /></dialog>
		<script type="module" src="/app.js"></script>
	</body>
</html>
